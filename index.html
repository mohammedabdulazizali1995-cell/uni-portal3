<style>
:root{--bg:#070b14;--panel:#0d1424;--panel2:#111a2e;--line:#1c2a45;
  --neon:#22d3ee;--neon2:#a78bfa;--accent:#f472b6;
  --txt:#e2e8f0;--mut:#8ea0bd;--ok:#34d399;--bad:#f87171;
  --glow:0 0 12px rgba(34,211,238,.35)}
body.mode-overdrive{--glow:0 0 22px rgba(34,211,238,.75),0 0 44px rgba(167,139,250,.4)}
body.mode-pulse{--glow:0 0 12px rgba(34,211,238,.35)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,'Noto Sans Arabic',sans-serif}
body{background:var(--bg);color:var(--txt);line-height:1.65}
::selection{background:var(--neon);color:#000}
header{position:sticky;top:0;z-index:500;background:rgba(7,11,20,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1280px;margin:auto;display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.logo{font-weight:900;font-size:1.25rem;background:linear-gradient(90deg,var(--neon),var(--neon2));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
nav{display:flex;gap:2px;flex-wrap:wrap;flex:1}
nav a{color:var(--mut);text-decoration:none;padding:7px 12px;border-radius:8px;font-size:.86rem;transition:.2s}
nav a:hover,nav a.on{color:#fff;background:rgba(34,211,238,.12);box-shadow:inset 0 0 0 1px rgba(34,211,238,.3)}
.kbtn{background:var(--panel2);border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:.82rem;display:flex;gap:8px;align-items:center}
.kbtn:hover{border-color:var(--neon);color:#fff}
select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:.85rem;cursor:pointer}
.wrap{max-width:1280px;margin:auto;padding:26px 18px}
.hero{padding:56px 18px 30px;text-align:center}
.hero h1{font-size:clamp(1.7rem,4.5vw,3rem);background:linear-gradient(90deg,var(--neon),var(--neon2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);max-width:720px;margin:14px auto 0}
.chips{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:8px 18px;font-size:.82rem;color:var(--mut)}
.chip b{color:var(--neon)}
section{margin:34px 0;scroll-margin-top:90px}
.stitle{font-size:1.5rem;margin-bottom:4px}
.stitle span{color:var(--neon)}
.ssub{color:var(--mut);font-size:.9rem;margin-bottom:20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--glow)}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
input[type=text],input[type=number],input[type=date]{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 13px;font-size:.9rem}
input:focus,select:focus{outline:none;border-color:var(--neon);box-shadow:0 0 0 3px rgba(34,211,238,.15)}
label{font-size:.75rem;color:var(--mut);display:block;margin-bottom:4px;font-weight:700}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.cat{background:var(--panel2);border:1px solid var(--line);color:var(--mut);border-radius:20px;padding:6px 16px;font-size:.82rem;cursor:pointer;transition:.2s}
.cat.on{background:linear-gradient(90deg,rgba(34,211,238,.2),rgba(167,139,250,.2));border-color:var(--neon);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:18px;transition:.25s;position:relative}
.card:hover{transform:translateY(-4px);border-color:var(--neon);box-shadow:var(--glow)}
.bkm{position:absolute;top:12px;inset-inline-end:12px;background:none;border:none;font-size:1.15rem;cursor:pointer;opacity:.45;transition:.2s}
.bkm.on{opacity:1;filter:drop-shadow(0 0 6px var(--accent))}
.cicon{font-size:1.7rem;margin-bottom:8px}
.card h4{font-size:1rem;margin-bottom:6px;padding-inline-end:26px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tag{font-size:.68rem;background:rgba(34,211,238,.1);color:var(--neon);border-radius:12px;padding:2px 10px;font-weight:700}
.tag.v{background:rgba(52,211,153,.12);color:var(--ok)}
.card a{color:var(--neon2);text-decoration:none;font-size:.82rem;font-weight:700}
.card a:hover{text-decoration:underline}
.empty{color:var(--mut);text-align:center;padding:30px;grid-column:1/-1}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{color:var(--neon);padding:8px 6px;border-bottom:2px solid var(--line);text-align:start;font-size:.75rem;white-space:nowrap}
td{padding:6px;border-bottom:1px solid var(--line)}
td input{width:64px;padding:5px 7px;font-size:.82rem;background:var(--bg)}
td input.wide{width:130px}
.btn{background:linear-gradient(90deg,var(--neon),var(--neon2));color:#04121a;font-weight:800;border:none;border-radius:10px;padding:10px 22px;cursor:pointer;font-size:.9rem;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:var(--glow)}
.btn.ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.stat{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0}
.stat .box{flex:1;min-width:130px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat .box b{font-size:1.4rem;display:block}
.stat .box small{color:var(--mut)}
.pill{display:inline-block;border-radius:20px;padding:3px 14px;font-size:.75rem;font-weight:800}
.pill.ok{background:rgba(52,211,153,.15);color:var(--ok)}
.pill.bad{background:rgba(248,113,113,.15);color:var(--bad)}
.pill.warn{background:rgba(244,114,182,.15);color:var(--accent)}
.calc-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.calcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.calc{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:18px;display:none}
.calc.on{display:block}
.calc h4{color:var(--neon);margin-bottom:10px}
.calc .res{background:rgba(34,211,238,.07);border:1px dashed rgba(34,211,238,.4);border-radius:10px;padding:12px;margin-top:12px;min-height:44px;font-weight:700;display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;cursor:pointer;transition:.2s}
.check:hover{border-color:var(--neon)}
.check input{width:18px;height:18px;accent-color:var(--neon)}
.check.done{opacity:.55;text-decoration:line-through}
.idwrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}
.idcard{background:linear-gradient(135deg,#0e1a30,#152238 55%,#0b1220);border:2px solid var(--neon);border-radius:18px;padding:22px;position:relative;overflow:hidden;box-shadow:var(--glow)}
.idcard::before{content:'';position:absolute;top:-60px;inset-inline-start:-60px;width:200px;height:200px;background:radial-gradient(circle,rgba(34,211,238,.25),transparent 70%)}
.idcard .uni{color:var(--neon);font-weight:800;font-size:.85rem;letter-spacing:1px}
.idcard .photo{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--neon),var(--neon2));display:flex;align-items:center;justify-content:center;font-size:1.7rem;font-weight:900;color:#04121a;float:inline-start;margin-inline-end:14px}
[dir="ltr"] .idcard .photo{float:left;margin-right:14px}
[dir="rtl"] .idcard .photo{float:right;margin-left:14px}
.idcard .nm{font-size:1.25rem;font-weight:800;margin-top:8px}
.idcard .info{font-size:.8rem;color:var(--mut);margin-top:4px}
.idcard .codes{display:flex;gap:16px;align-items:center;margin-top:16px;flex-wrap:wrap}
.idcard svg,.idcard img{background:#fff;border-radius:6px;padding:4px}
#qrbox{width:92px;height:92px;background:#fff;border-radius:8px;padding:5px;display:flex;align-items:center;justify-content:center}
#qrbox img,#qrbox canvas{width:100%!important;height:100%!important}
.neon-modes{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.nmode{background:var(--panel2);border:1px solid var(--line);color:var(--mut);border-radius:12px;padding:14px 22px;cursor:pointer;text-align:center;transition:.25s;flex:1;min-width:130px}
.nmode.on{border-color:var(--neon);color:#fff}
.nmode .dot{width:14px;height:14px;border-radius:50%;margin:0 auto 6px}
.palette{position:fixed;inset:0;background:rgba(3,6,12,.75);backdrop-filter:blur(6px);z-index:2000;display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
.palette.on{display:flex}
.pbox{width:min(560px,92vw);background:var(--panel);border:1px solid var(--neon);border-radius:16px;overflow:hidden;box-shadow:0 0 60px rgba(34,211,238,.35)}
.pbox input{border:none;background:var(--panel2);border-radius:0;font-size:1rem;padding:16px 18px;border-bottom:1px solid var(--line)}
.plist{max-height:320px;overflow:auto}
.pitem{padding:12px 18px;cursor:pointer;font-size:.9rem;display:flex;justify-content:space-between;color:var(--txt)}
.pitem:hover,.pitem.sel{background:rgba(34,211,238,.1)}
.pitem small{color:var(--mut)}
body.mode-pulse .card{animation:pl 2.6s ease-in-out infinite}
@keyframes pl{0%,100%{box-shadow:var(--glow)}50%{box-shadow:0 0 26px rgba(167,139,250,.55)}}
body.mode-overdrive .card:hover{box-shadow:0 0 30px rgba(34,211,238,.8),0 0 60px rgba(167,139,250,.5)}
.foot{text-align:center;color:var(--mut);font-size:.8rem;padding:34px 18px;border-top:1px solid var(--line);margin-top:40px}
.toast{position:fixed;bottom:24px;inset-inline-start:24px;background:var(--panel);border:1px solid var(--ok);color:var(--ok);padding:12px 24px;border-radius:30px;font-weight:700;z-index:3000;display:none}
@media(max-width:640px){.row2{grid-template-columns:1fr}nav{display:none}}
</style>

const SEL={}; // per-division filter state
function buildApp(){document.documentElement.lang=S.lang;
 document.documentElement.dir=(S.lang==='en')?'ltr':'rtl';
 $('#langSel').value=S.lang;document.body.className='mode-'+S.neon;
 const A=$('#app');A.innerHTML='';
 [['bsc',4,'bscSub'],['msc',2,'mscSub'],['phd',3,'phdSub']].forEach(([id,stages])=>{
  if(!SEL[id])SEL[id]={st:0,tr:0,sem:0,cat:'cat_all',q:''};
  A.innerHTML+=`<section id="${id}"><div class="stitle">${id==='bsc'?'🎓':id==='msc'?'🧑‍🔬':'🔬'} ${t(id)}</div>
  <div class="ssub">${t('verified')}</div>
  <div class="panel"><div class="controls">
    <div><label>${t('search')}</label><input type="text" placeholder="🔍 ${t('search')}" value="${SEL[id].q}" oninput="SEL['${id}'].q=this.value;renderCat('${id}')"></div>
    <div><label>${t('stage')}</label><select onchange="SEL['${id}'].st=+this.value;renderCat('${id}')">${[0,1,2,3,4].filter(x=>x<=stages).map(s=>`<option value="${s}" ${SEL[id].st===s?'selected':''}>${s===0?t('all'):t('stage_s')+' '+s}</option>`).join('')}</select></div>
    <div><label>${t('track')}</label><select onchange="SEL['${id}'].tr=+this.value;renderCat('${id}')">${TRACKS.map((k,i)=>`<option value="${i}" ${SEL[id].tr===i?'selected':''}>${t(k)}</option>`).join('')}</select></div>
    <div><label>${t('semester')}</label><select onchange="SEL['${id}'].sem=+this.value;renderCat('${id}')">${[0,1,2].map(s=>`<option value="${s}" ${SEL[id].sem===s?'selected':''}>${s===0?t('all'):t('sem_s')+' '+s}</option>`).join('')}</select></div>
  </div>
  <div class="cats">${CATS.map(c=>`<button class="cat ${SEL[id].cat===c?'on':''}" onclick="SEL['${id}'].cat='${c}';buildApp();renderCat('${id}')">${CAT_ICON[c]||''} ${t(c)}</button>`).join('')}</div>
  <div class="grid" id="grid-${id}"></div></div></section>`;});
 A.innerHTML+=bolognaHTML()+hubHTML();
 ['bsc','msc','phd'].forEach(renderCat);
 renderBologna();updateGPA();renderChecks();}

function renderCat(id){const g=$('#grid-'+id);if(!g)return;const s=SEL[id];g.innerHTML='';
 const items=CATALOG.filter(x=>x.d===['bsc','msc','phd'].indexOf(id))
  .filter(x=>(s.cat==='cat_all'||x.cat===s.cat)&&(s.st===0||x.st===s.st||x.st===0)
   &&(s.tr===0||x.tr===s.tr||x.tr===0)&&(s.sem===0||x.sem===s.sem||x.sem===0))
  .filter(x=>{if(!s.q)return true;const q=s.q.toLowerCase();
   return x.en.toLowerCase().includes(q)||x.ar.includes(s.q)||x.ku.toLowerCase().includes(q);});
 if(!items.length){g.innerHTML=`<div class="empty">🔍 ${t('empty')}</div>`;return;}
 items.forEach(x=>{const key=x.url;const on=S.bkm.includes(key);
  const title=S.lang==='ar'?x.ar:S.lang==='ku'?x.ku:x.en;
  g.innerHTML+=`<div class="card"><button class="bkm ${on?'on':''}" onclick="toggleBkm('${key}',this)" title="${t('bookmark')}">${on?'🔖':'📑'}</button>
  <div class="cicon">${CAT_ICON[x.cat]||'📘'}</div><h4>${title}</h4>
  <div class="meta">${x.st?`<span class="tag">${t('stage_s')} ${x.st}</span>`:''}${x.sem?`<span class="tag">${t('sem_s')} ${x.sem}</span>`:''}${x.tr?`<span class="tag">${t(TRACKS[x.tr])}</span>`:''}<span class="tag v">${t('verified')}</span></div>
  <a href="${x.url}" target="_blank" rel="noopener">🔗 ${t('goto')}</a></div>`;});}

function toggleBkm(k,el){const i=S.bkm.indexOf(k);
 if(i>=0)S.bkm.splice(i,1);else S.bkm.push(k);
 el.classList.toggle('on');el.textContent=el.classList.contains('on')?'🔖':'📑';save();}

function bolognaHTML(){return `<section id="bologna"><div class="stitle">🇪🇺 <span>${t('bologna_t').replace('🇪🇺 ','')}</span></div>
 <div class="ssub">${t('bologna_p')}</div><div class="panel">
 <div class="controls" style="grid-template-columns:200px 1fr auto;align-items:end">
   <div><label>${t('target')}</label><input type="number" id="bTarget" value="60" min="0" max="100" oninput="renderBologna()"></div>
   <div class="ssub" style="margin:0">${t('whatif')}</div>
   <button class="btn" onclick="addBologna()">${t('add_course')}</button></div>
 <div style="overflow-x:auto"><table id="bTable"><thead><tr>
   <th>${t('course')}</th><th>${t('ects')}</th><th>${t('quizzes')}</th><th>${t('midterm')}</th><th>${t('cont')}</th><th>${t('fw')}</th><th>${t('cur')}</th><th>${t('total')}</th><th>${t('status')}</th><th>${t('needed')}</th><th></th>
 </tr></thead><tbody id="bBody"></tbody></table></div>
 <div class="stat"><div class="box"><b id="bOver">—</b><small>${t('overall')}</small></div>
 <div class="box"><b id="bEcts">—</b><small>${t('ects')}</small></div>
 <div class="box"><b id="bCnt">—</b><small>${t('pass')}/${t('fail')}</small></div></div>
</div></section>`;}

function addBologna(){S.bologna.push({n:'',e:6,q:0,m:0,c:0,f:40,u:0});save();renderBologna();}
function delBologna(i){S.bologna.splice(i,1);save();renderBologna();}
function bField(i,f,v){S.bologna[i][f]=parseFloat(v)||0;save();renderBologna();}

function renderBologna(){const tb=$('#bBody');if(!tb)return;tb.innerHTML='';
 const target=parseFloat($('#bTarget')?.value)||60;let tot=0,w=0,p=0;
 S.bologna.forEach((r,i)=>{const cw=100-Math.min(r.f,100);
  const now=((r.q+r.m+r.c)/3)*(cw/100);
  const totR=Math.min(100,now+Math.min(r.f,100)*(r.u? r.u:0)/100);
  const need=(target-now)/(r.f/100);
  const passNow=totR>=target;
  tot+=totR*(r.e||0);w+=(r.e||0);if(passNow)p++;
  tb.innerHTML+=`<tr><td><input class="wide" value="${r.n}" placeholder="CE-101" oninput="S.bologna[${i}].n=this.value;save()"></td>
  <td><input type="number" value="${r.e}" min="1" max="30" oninput="bField(${i},'e',this.value)"></td>
  <td><input type="number" value="${r.q}" min="0" max="100" oninput="bField(${i},'q',this.value)"></td>
  <td><input type="number" value="${r.m}" min="0" max="100" oninput="bField(${i},'m',this.value)"></td>
  <td><input type="number" value="${r.c}" min="0" max="100" oninput="bField(${i},'c',this.value)"></td>
  <td><input type="number" value="${r.f}" min="0" max="100" oninput="bField(${i},'f',this.value)"></td>
  <td><input type="number" value="${r.u}" min="0" max="100" oninput="bField(${i},'u',this.value)"></td>
  <td><b style="color:var(--neon)">${totR.toFixed(1)}</b></td>
  <td>${passNow?`<span class="pill ok">${t('pass')}</span>`:`<span class="pill bad">${t('fail')}</span>`}</td>
  <td>${need<=0?`<span class="pill ok">${t('secured')}</span>`:need>100?`<span class="pill bad">>100%</span>`:`<span class="pill warn">${need.toFixed(1)}%</span>`}</td>
  <td><button class="btn danger" style="padding:4px 10px" onclick="delBologna(${i})">${t('del')}</button></td></tr>`;});
 if($('#bOver')){$('#bOver').textContent=w?(tot/w).toFixed(1)+' / 100':'—';
  $('#bEcts').textContent=w;$('#bCnt').textContent=p+' / '+S.bologna.length;}}

 <div class="neon-modes">${['studio','overdrive','pulse'].map(m=>`<button class="nmode ${S.neon===m?'on':''}" onclick="setNeon('${m}')"><div class="dot" style="background:${m==='studio'?'#22d3ee':m==='overdrive'?'#a78bfa':'#f472b6'};box-shadow:0 0 ${m==='studio'?'6':m==='overdrive'?'14':'10'}px ${m==='studio'?'#22d3ee':m==='overdrive'?'#a78bfa':'#f472b6'}"></div>${t(m)}</button>`).join('')}</div>

 <div class="stitle" style="margin-top:26px">🧮 <span>${t('calc_t').replace('🧮 ','')}</span></div>
 <div class="ssub">${t('calc_p')}</div>
 <div class="panel"><div class="calc-tabs">
   <button class="cat on" onclick="showCalc(0)">⚡ ${t('ohm')}</button>
   <button class="cat" onclick="showCalc(1)">🔢 ${t('base')}</button>
   <button class="cat" onclick="showCalc(2)">📡 ${t('power')}</button>
   <button class="cat" onclick="showCalc(3)">📏 ${t('length')}</button>
   <button class="cat" onclick="showCalc(4)">📊 ${t('gpa')}</button>
   <button class="cat" onclick="showCalc(5)">✅ ${t('checklist')}</button></div>
 <div class="calcs">
  <div class="calc on"><h4>⚡ ${t('ohm')}</h4>
   <div class="row2"><div><label>${t('v')}</label><input type="number" id="oV" oninput="ohm()"></div>
   <div><label>${t('i')}</label><input type="number" id="oI" oninput="ohm()"></div></div>
   <div><label>${t('r')}</label><input type="number" id="oR" oninput="ohm()">
   <div class="res" id="ohmOut">V = I × R</div>
   <hr style="border-color:var(--line);margin:12px 0">
   <div class="row2"><div><label>${t('vin')}</label><input type="number" id="dVin" value="12" oninput="ohm()"></div>
   <div><label>${t('vout')}</label><input type="number" id="dR1" value="1000" oninput="ohm()"></div></div>
   <div class="row2"><div><label>${t('r2')}</label><input type="number" id="dR2" value="1000" oninput="ohm()"></div><div></div></div>
   <div class="res" id="divOut">Vout = Vin × R2/(R1+R2)</div></div>
  <div class="calc"><h4>🔢 ${t('base')}</h4>
   <label>${t('dec')}</label><input type="text" id="nDec" oninput="fromBase('d')" placeholder="255">
   <label>${t('bin')}</label><input type="text" id="nBin" oninput="fromBase('b')" placeholder="11111111">
   <label>${t('oct')}</label><input type="text" id="nOct" oninput="fromBase('o')" placeholder="377">
   <label>${t('hex')}</label><input type="text" id="nHex" oninput="fromBase('h')" placeholder="FF"></div>
  <div class="calc"><h4>📡 ${t('power')}</h4>
   <div class="row2"><div><label>${t('dbm')}</label><input type="number" id="pDbm" value="0" oninput="dbmW()"></div>
   <div><label>${t('watt')}</label><input type="number" id="pW" oninput="wDbm()"></div></div>
   <div class="res" id="powOut"></div>
   <div class="ssub" style="margin-top:10px">0 dBm = 1 mW &nbsp;•&nbsp; 30 dBm = 1 W</div></div>
  <div class="calc"><h4>📏 ${t('length')}</h4>
   <label>${t('m')}</label><input type="number" id="lM" value="1" oninput="lenF('m')">
   <div class="row2"><div><label>${t('km')}</label><input type="number" id="lKm" oninput="lenF('km')"></div>
   <div><label>${t('cm')}</label><input type="number" id="lCm" oninput="lenF('cm')"></div></div>
   <div class="row2"><div><label>${t('mm')}</label><input type="number" id="lMm" oninput="lenF('mm')"></div>
   <div><label>${t('mi')}</label><input type="number" id="lMi" oninput="lenF('mi')"></div></div>
   <label>${t('ft')}</label><input type="number" id="lFt" oninput="lenF('ft')"></div>
  <div class="calc" style="grid-column:1/-1"><h4>📊 ${t('gpa')}</h4>
   <table><thead><tr><th>${t('course_g')}</th><th>${t('grade')}</th><th>${t('cred')}</th><th></th></tr></thead>
   <tbody id="gBody"></tbody></table>
   <button class="btn ghost" style="margin-top:10px" onclick="addG()">${t('add_row')}</button>
   <div class="res" id="gOut"></div></div>
  <div class="calc" style="grid-column:1/-1"><h4>✅ ${t('checklist')} <span class="pill ok" id="ckPill">0%</span></h4>
   <div id="ckList"></div><div class="progress" style="height:10px;background:var(--line);border-radius:10px;overflow:hidden;margin-top:10px"><div id="ckBar" style="height:100%;width:0;background:linear-gradient(90deg,var(--neon),var(--neon2));transition:.4s"></div></div></div>
 </div></div>

 <div class="stitle" style="margin-top:26px">🪪 <span>${t('id_t').replace('🪪 ','')}</span></div>
 <div class="ssub">${t('id_p')}</div>
 <div class="idwrap"><div class="panel">
  <label>${t('full_name')}</label><input type="text" id="idName" value="${S.id.name}" oninput="idF('name',this.value)">
  <div class="row2"><div><label>${t('student_id')}</label><input type="text" id="idSid" value="${S.id.sid}" oninput="idF('sid',this.value)"></div>
  <div><label>${t('valid')}</label><input type="date" id="idValid" value="${S.id.valid}" oninput="idF('valid',this.value)"></div></div>

  <label>${t('division')}</label><select id="idDiv" onchange="idF('div',this.value)">
   <option value="bsc" ${S.id.div==='bsc'?'selected':''}>${t('st_bsc')}</option>
   <option value="msc" ${S.id.div==='msc'?'selected':''}>${t('st_msc')}</option>
   <option value="phd" ${S.id.div==='phd'?'selected':''}>${t('st_phd')}</option></select>
  <button class="btn" style="margin-top:14px" onclick="dlID()">${t('download_id')}</button></div>
 <div class="idcard" id="idCard">
  <div class="uni">⚡ ENGICORE UNIVERSITY</div>
  <div style="overflow:hidden;margin-top:14px"><div class="photo" id="idPhoto">?</div>
   <div class="nm" id="cName">—</div>
   <div class="info" id="cInfo">—</div></div>
  <div class="codes"><div id="qrbox"></div><div><svg id="barcode"></svg>
   <div class="info" id="cMeta" style="margin-top:4px"></div></div></div>
 </div></div>

 <div class="stitle" style="margin-top:26px">💾 <span>${t('export_t').replace('💾 ','')}</span></div>
 <div class="ssub">${t('export_p')}</div>
 <div class="panel" style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
  <button class="btn" onclick="exportJSON()">${t('export')}</button>

</section><div class="foot">${t('footer')}</div>`;}

function setNeon(m){S.neon=m;save();document.body.className='mode-'+m;
 document.querySelectorAll('.nmode').forEach(b=>b.classList.toggle('on',b.textContent.trim()===t(m)));}
function showCalc(i){document.querySelectorAll('.calc').forEach((c,j)=>c.classList.toggle('on',i===j));
 document.querySelectorAll('.calc-tabs .cat').forEach((c,j)=>c.classList.toggle('on',i===j));}

/* ---- calculators logic ---- */
function ohm(){const V=parseFloat($('#oV').value),I=parseFloat($('#oI').value),R=parseFloat($('#oR').value);
 let out=[];if(!isNaN(V)&&!isNaN(I))out.push('R = '+(V/I).toFixed(3)+' Ω');if(!isNaN(V)&&!isNaN(R))out.push('I = '+(V/R).toFixed(3)+' A');if(!isNaN(I)&&!isNaN(R))out.push('V = '+(I*R).toFixed(3)+' V');
 $('#ohmOut').innerHTML=out.length?out.join(' &nbsp;•&nbsp; '):'V = I × R';
 const vin=parseFloat($('#dVin').value)||0,r1=parseFloat($('#dR1').value)||0,r2=parseFloat($('#dR2').value)||0;
 $('#divOut').textContent='Vout = '+(r1+r2? vin*r2/(r1+r2):0).toFixed(3)+' V';}
function fromBase(f){const map={d:['nDec',10],b:['nBin',2],o:['nOct',8],h:['nHex',16]};
 const v=$('#'+map[f][0]).value.trim();const n=parseInt(v,map[f][1]);
 const ids=['nDec','nBin','nOct','nHex'];if(isNaN(n)){return;}
 const bs=[10,2,8,16];ids.forEach((id,i)=>{if(id!==map[f][0])$('#'+id).value=n.toString(bs[i]).toUpperCase();});}
function dbmW(){const d=parseFloat($('#pDbm').value);if(isNaN(d))return;
 const w=Math.pow(10,(d-30)/10);$('#pW').value=w.toExponential(4);
 $('#powOut').innerHTML=`${d} dBm = <b>${w.toExponential(3)} W</b> = ${(w*1000).toPrecision(4)} mW`;}
function wDbm(){const w=parseFloat($('#pW').value);if(isNaN(w)||w<=0)return;
 const d=10*Math.log10(w)+30;$('#pDbm').value=d.toFixed(2);
 $('#powOut').innerHTML=`<b>${d.toFixed(2)} dBm</b> = ${w.toExponential(3)} W`;}
const LF={m:1,km:.001,cm:100,mm:1000,mi:.000621371,ft:3.28084};
function lenF(f){const v=parseFloat($('#l'+f[0].toUpperCase()+f.slice(1)).value);if(isNaN(v))return;
 Object.keys(LF).forEach(k=>{const el=$('#l'+k[0].toUpperCase()+k.slice(1));if(k!==f)el.value=(v*LF[f]/LF[k]).toPrecision(6).replace(/\.?0+$/,'');});}

/* ---- GPA ---- */
function addG(){S.gpa.push({n:'',g:0,c:3});save();updateGPA(true);}
function delG(i){S.gpa.splice(i,1);save();updateGPA(true);}
function gField(i,f,v){S.gpa[i][f]=f==='n'?v:(parseFloat(v)||0);save();updateGPA();}
function updateGPA(rebuild){const tb=$('#gBody');if(!tb)return;
 if(rebuild||tb.children.length!==S.gpa.length){tb.innerHTML='';S.gpa.forEach((r,i)=>{
  tb.innerHTML+=`<tr><td><input class="wide" value="${r.n}" placeholder="CE-101" oninput="gField(${i},'n',this.value)"></td>
  <td><input type="number" value="${r.g}" min="0" max="100" oninput="gField(${i},'g',this.value)"></td>
  <td><input type="number" value="${r.c}" min="1" oninput="gField(${i},'c',this.value)"></td>
  <td><button class="btn danger" style="padding:4px 10px" onclick="delG(${i})">${t('del')}</button></td></tr>`;});}
 let gp=0,ch=0;S.gpa.forEach(r=>{const p=r.g>=90?4:r.g>=80?3:r.g>=70?2:r.g>=60?1:0;gp+=p*(r.c||0);ch+=(r.c||0);});
 $('#gOut').innerHTML=ch?`${t('gpa_res')}: <b style="font-size:1.3rem;color:var(--neon)">${(gp/ch).toFixed(2)}</b> / 4.00 — ${ch} ${t('cred')}`:t('gpa_res');}

/* ---- checklist ---- */
const CKKEYS=['ck1','ck2','ck3','ck4','ck5','ck6','ck7','ck8'];
function renderChecks(){const el=$('#ckList');if(!el)return;el.innerHTML='';
 CKKEYS.forEach((k,i)=>{const on=S.checklist.includes(i);
  el.innerHTML+=`<div class="check ${on?'done':''}" onclick="toggleCk(${i})"><input type="checkbox" ${on?'checked':''} onclick="event.preventDefault();toggleCk(${i})"><span>${t(k)}</span></div>`;});
 const p=Math.round(S.checklist.length/CKKEYS.length*100);
 $('#ckBar').style.width=p+'%';$('#ckPill').textContent=p+'% '+t('ready');}
function toggleCk(i){const x=S.checklist.indexOf(i);x>=0?S.checklist.splice(x,1):S.checklist.push(i);save();renderChecks();}

/* ---- ID card ---- */
function idF(f,v){S.id[f]=v;save();renderID();}
function renderID(){if(!$('#idCard'))return;
 const n=S.id.name||'—';$('#cName').textContent=n;
 $('#idPhoto').textContent=(S.id.name||'?').trim().charAt(0).toUpperCase()||'?';
 $('#cInfo').innerHTML=`ID: <b style="color:#fff">${S.id.sid||'—'}</b> • ${S.id.uni||'—'}`;
 $('#cMeta').textContent=`${t(S.id.div==='bsc'?'st_bsc':S.id.div==='msc'?'st_msc':'st_phd')}${S.id.valid?' • '+t('valid')+': '+S.id.valid:''}`;
 const q=$('#qrbox');q.innerHTML='';
 new QRCode(q,{text:JSON.stringify({name:S.id.name,sid:S.id.sid,uni:S.id.uni,div:S.id.div}),width:82,height:82});
 try{JsBarcode('#barcode',S.id.sid||'ENGICORE-0000',{format:'CODE128',displayValue:true,height:44,width:1.6,fontSize:12,margin:0});}catch(e){}}
function dlID(){html2canvas($('#idCard'),{scale:2}).then(c=>{const a=document.createElement('a');
 a.download='engicore-id.png';a.href=c.toDataURL('image/png');a.click();toast('PNG ✓');});}

/* ---- export / import ---- */
function exportJSON(){const blob=new Blob([JSON.stringify({app:'EngiCore',exportedAt:new Date().toISOString(),...S},null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='engicore-state.json';a.click();
 $('#lastSave').textContent=new Date().toLocaleString();toast(t('saved'));}
function importJSON(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{S=Object.assign({},DEF,JSON.parse(r.result));save();buildApp();renderID();toast(t('imported'));}catch(x){toast('✕ JSON');}};r.readAsText(f);}

/* ================= COMMAND PALETTE ================= */
const ACTIONS=[
 {k:'palette',run:()=>togglePalette(true),label:{en:'Command Palette',ar:'لوحة الأوامر',ku:'Rûpela Fermanan'}},
 {k:'home',run:()=>go('top')},{k:'bsc',run:()=>go('bsc')},{k:'msc',run:()=>go('msc')},{k:'phd',run:()=>go('phd')},
 {k:'bologna',run:()=>go('bologna')},{k:'add_course',run:()=>{go('bologna');addBologna();}},
 {k:'ohm',run:()=>{go('hub');showCalc(0);}},{k:'base',run:()=>{go('hub');showCalc(1);}},
 {k:'power',run:()=>{go('hub');showCalc(2);}},{k:'length',run:()=>{go('hub');showCalc(3);}},
 {k:'gpa',run:()=>{go('hub');showCalc(4);}},{k:'checklist',run:()=>{go('hub');showCalc(5);}},
 {k:'studio',run:()=>setNeon('studio')},{k:'overdrive',run:()=>setNeon('overdrive')},{k:'pulse',run:()=>setNeon('pulse')},
 {k:'download_id',run:()=>{renderID();dlID();}},{k:'export',run:exportJSON}];
function go(id){const el=document.getElementById(id);if(el)el.scrollIntoView({behavior:'smooth'});}
let pSel=0;
function togglePalette(on){$('#palette').classList.toggle('on',on);if(on){$('#pinput').value='';pSel=0;renderPalette();setTimeout(()=>$('#pinput').focus(),50);}else pSel=0;}
function renderPalette(){const q=$('#pinput').value.toLowerCase();const l=S.lang;const pl=$('#plist');
 const items=ACTIONS.map(a=>({lbl:a.label?a.label[l]||a.label.en:t(a.k),run:a.run}))
  .filter(a=>!q||a.lbl.toLowerCase().includes(q));
 pl.innerHTML=items.slice(0,9).map((a,i)=>`<div class="pitem ${i===pSel?'sel':''}" onclick="(${''});runP(${i})" data-i="${i}"><span>${a.lbl}</span><small>${t('act')} ↵</small></div>`).join('')||`<div class="pitem"><span>—</span></div>`;
 pl.querySelectorAll('.pitem').forEach(el=>el.onclick=()=>runP(+el.dataset.i));}
function runP(i){const q=$('#pinput').value.toLowerCase();
 const items=ACTIONS.map(a=>({lbl:a.label?a.label[S.lang]||a.label.en:t(a.k),run:a.run})).filter(a=>!q||a.lbl.toLowerCase().includes(q));
 if(items[i]){togglePalette(false);items[i].run();}}
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();togglePalette(!$('#palette').classList.contains('on'));}
 if(e.key==='Escape')togglePalette(false);
 if($('#palette').classList.contains('on')){
  if(e.key==='ArrowDown'){e.preventDefault();pSel=Math.min(pSel+1,8);renderPalette();}
  if(e.key==='ArrowUp'){e.preventDefault();pSel=Math.max(pSel-1,0);renderPalette();}
  if(e.key==='Enter'){e.preventDefault();runP(pSel);}}});

function toast(m){const el=$('#toast');el.textContent=m;el.style.display='block';
 clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',2200);}

/* ================= INIT ================= */
buildNav();buildApp();renderID();ohm();dbmW();lenF('m');
</script>
